name: release

# Push a tag such as underwriting-v1.0.0 to publish a release for one plugin. The part before
# "-v" is the plugin's folder under plugins/, and the version must equal the one in that plugin's
# .claude-plugin/plugin.json. The release attaches one uploadable zip per skill, built from the
# same commit and the same folders the plugin serves.
#
# After the versioned release, a rolling release named <plugin>-latest is repointed at this commit
# and given the same files. The website links to its stable URLs:
#   https://github.com/RadixInc/skills/releases/download/<plugin>-latest/<skill>.zip
on:
  push:
    tags: ["*-v[0-9]*.[0-9]*.[0-9]*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so origin/main is available for the check below.
          fetch-depth: 0
          # The token is passed to the steps that need it, not left in .git/config for later steps.
          persist-credentials: false

      - name: Tag must be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python3 scripts/validate_skills.py

      # Fails unless the tag matches the format, names a plugin in the marketplace and equals its version.
      - name: Build skill zips
        run: python3 scripts/build_skill_zips.py --out dist --tag "$GITHUB_REF_NAME"

      - name: Create versioned release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --latest=false \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      # Runs last, so a problem here can't block the versioned release above.
      - name: Update rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          slug="${GITHUB_REF_NAME%-v*}"
          alias="${slug}-latest"
          notes="Rolling release for ${slug}: always the newest version, currently ${GITHUB_REF_NAME}. Link to these files for stable URLs. Past versions are separate releases."

          # Repoint the alias tag through the API, so git needs no credentials.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${alias}" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${alias}" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${alias}" -f sha="$GITHUB_SHA" >/dev/null
          fi

          if gh release view "$alias" >/dev/null 2>&1; then
            gh release upload "$alias" dist/* --clobber
            gh release edit "$alias" --notes "$notes" --latest=false
            # Remove files from skills that no longer exist.
            for asset in $(gh release view "$alias" --json assets --jq '.assets[].name'); do
              if [ ! -e "dist/$asset" ]; then
                gh release delete-asset "$alias" "$asset" --yes
              fi
            done
          else
            gh release create "$alias" dist/* \
              --verify-tag \
              --latest=false \
              --title "${slug} (latest)" \
              --notes "$notes"
          fi
