name: release

# Push a tag such as v0.2.0 to publish a release. The tag must equal the version in
# plugins/*/.claude-plugin/plugin.json. The release attaches one uploadable zip per skill,
# built from the same commit and the same folders the plugin serves.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag must be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python3 scripts/validate_skills.py

      - name: Build skill zips
        run: python3 scripts/build_skill_zips.py --out dist --tag "$GITHUB_REF_NAME"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
