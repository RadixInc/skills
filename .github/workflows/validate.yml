name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/validate_skills.py
      # Dry run of the release build, so a packaging problem fails the PR and not the tag.
      - run: python3 scripts/build_skill_zips.py --out "$RUNNER_TEMP/dist"

  # Runs Claude Code's own manifest checks. Not blocking yet: the CLI is installed unpinned.
  # Pin a version and drop continue-on-error once it has run green a few times.
  claude-validate:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global @anthropic-ai/claude-code
      - run: claude plugin validate . --strict
      - run: claude plugin validate plugins/underwriting --strict

  # Required status check on main. Keep the job name `secrets`: the ruleset matches on it.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source /repo --redact --verbose
